amcl:
  ros__parameters:
    use_sim_time: False
    set_initial_pose: True
    initial_pose: [0.0, 0.0, 0.0, 0.0]
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recover_alpha_fast: 0.0
    recover_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: True
    transform_tolerance: 1.0
    # 2026-07-06: TRIED lowering to 0.05/0.05 to test whether infrequent AMCL
    # corrections (pose jumps at each update) were driving the PD heading
    # oscillation. REVERTED -- it did not fix the PD oscillation (rmse/corr
    # unchanged) AND made the previously-stable curvature-only (use_pd_heading
    # false) mode wavy too, that was NOT wavy before. Likely cause: in this
    # warehouse's narrow, repetitive-looking aisles, forcing near-continuous
    # AMCL corrections injects more particle-filter jitter into the pose than
    # it removes -- infrequent corrections meant most of the time the pose
    # was smooth short-term odometry extrapolation instead. Back to defaults.
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan_restamped

controller_server:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0

      max_vel_theta: 0.6
      min_speed_theta: 0.55
      min_speed_xy: 0.0
      max_speed_xy: 0.2

      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 0.3
      decel_lim_x: -0.3
      decel_lim_y: 0.0
      decel_lim_theta: -0.3

      vx_samples: 10
      vy_samples: 0
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True

      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      allow_unknown: true
      tolerance: 0.25                 # dist (m) to goal at which a plan is "good enough"
      max_iterations: 1000000         # search iter limit before failing
      max_on_approach_iterations: 1000
      max_planning_time: 5.0          # seconds
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      # Custom primitives, generated 2026-07-06 for this robot's actual turning
      # radius (turning_radius = max_linear_speed/max_angular_speed = 0.20/0.60
      # = 0.333m, rounded up to 0.35m for margin), replacing the generic
      # 0.5m-turning-radius demo set shipped with nav2_smac_planner. Generated
      # with the nav2_smac_planner/lattice_primitives tool (motion_model=diff,
      # grid_resolution=0.05, num_of_headings=16, stopping_threshold=5).
      lattice_filepath: "/home/kanal-raspi5/Autonomous-Mobile-Robot/ws_amr_robot/install/robot_bringup/share/robot_bringup/config/lattice_primitives/0.35m_turning_radius/diff/output.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false  # warehouse AMR: do not plan reverse motions
      smooth_path: true
      smoother:
        max_iterations: 2000
        # Raised from 0.3 (2026-07-06): Foxglove showed the RAW /plan itself
        # (not just the robot's tracked response) visibly wavy/kinked even
        # with the custom 0.35m-turning-radius lattice -- the built-in
        # smoother wasn't aggressive enough to straighten the chained
        # primitive segments. This is a cheaper, more targeted fix than
        # regenerating primitives again. Revert toward 0.3 if the smoothed
        # path starts cutting into inflated/lethal cost cells near racks.
        w_smooth: 0.6
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 3

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.395, 0.228], [0.395, -0.228], [-0.395, -0.228], [-0.395, 0.228] ]"
      plugins: ["obstacle_layer", "keepout_filter", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_restamped
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.35
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

global_costmap:
  global_costmap:
    ros__parameters:
      # REAL ROOT CAUSE found 2026-07-06 (the update_frequency/publish_frequency
      # tuning above was a red herring): Nav2's Costmap2DPublisher defaults to
      # `always_send_full_costmap: false`, meaning the FULL grid on
      # /global_costmap/costmap is only sent ONCE (or on costmap resize) --
      # afterwards only /global_costmap/costmap_updates (incremental diffs)
      # go out. custom_path_controller.py only subscribes to the full-grid
      # topic (never costmap_updates), so its cached self._costmap has been a
      # ONE-TIME STARTUP SNAPSHOT the whole time, not a live view -- any
      # obstacle present at that exact moment gets "baked in" permanently
      # (or, if none, the controller never sees new obstacles at all). This
      # explains the mysterious mid-goal freezes far better than the
      # frequency changes below ever did. Fix: force the full grid to
      # actually keep republishing.
      always_send_full_costmap: true
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[ [0.395, 0.228], [0.395, -0.228], [-0.395, -0.228], [-0.395, 0.228] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer","keepout_filter", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_restamped
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.35
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

behavior_server:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: False
    costmap_topic: "local_costmap/costmap_raw"
    footprint_topic: "local_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      speed: -0.5
      target_distance: 0.2
      time_allowance: 10.0
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: True
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.6]
    min_velocity: [-0.2, 0.0, -0.6]
    max_accel: [0.3, 0.0, 0.4]
    max_decel: [-0.3, 0.0, -0.4]
    deadband_velocity: [0.01, 0.0, 0.01]
    odom_topic: "odom"
    odom_duration: 0.1
    velocity_timeout: 1.0
